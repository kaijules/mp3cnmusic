<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
        />
        <title>MAppEwi</title>
        <style>
            /* Cho phép --tint-rgb chuyển màu mượt khi đổi bài */
            @property --tint-rgb {
              syntax: "<number>#";
              inherits: true;
              initial-value: 232, 228, 239;
            }

            :root {
              --bg: #f2f2f7;
              --bg2: #e5e5ea;
              --surface: #ffffff;
              --surface2: #f5f5f7;
              --text: #1c1c1e;
              --sub: #6e6e73;
              --muted: #8e8e93;
              --accent: #ff2d55;
              --accent2: #bf5af2;
              --green: #30d158;
              --track: rgba(0,0,0,.12);
              --glass: rgba(255,255,255,.85);
              --shadow: 0 12px 40px rgba(0,0,0,.12);
              color-scheme: light;
            }

            *, *::before, *::after { box-sizing: border-box; }
            html, body { height: 100%; margin: 0; }
            body {
              background: var(--bg);
              color: var(--text);
              font-family: -apple-system, "SF Pro Display", "PingFang SC", "Noto Sans SC", "Segoe UI", system-ui, sans-serif;
              -webkit-font-smoothing: antialiased;
              -webkit-tap-highlight-color: transparent;
              overflow: hidden;
              user-select: none;
            }
            button {
              background: none; border: 0; color: inherit; padding: 0;
              cursor: pointer; font: inherit; -webkit-appearance: none;
            }
            [hidden] { display: none !important; }
            svg { display: block; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
            img { display: block; max-width: 100%; }

            .app {
              position: relative;
              height: 100%;
              max-width: 430px;
              margin: 0 auto;
              overflow: hidden;
              background: var(--bg);
            }

            /* ========== HOME ========== */
            .home {
              position: absolute; inset: 0;
              display: flex; flex-direction: column;
              transition: transform .5s cubic-bezier(.32,.72,0,1), opacity .4s;
            }
            .app.show .home {
              transform: scale(.94) translateY(-8px);
              opacity: .35;
              pointer-events: none;
            }

            .home-header {
              padding: calc(12px + env(safe-area-inset-top, 0px)) 20px 8px;
              display: flex; align-items: center; justify-content: space-between;
            }
            .home-header h1 {
              margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.4px;
            }

            .seg {
              position: relative;
              display: flex;
              background: var(--surface2);
              border-radius: 12px;
              padding: 3px;
              margin: 4px 20px 12px;
            }
            .seg i {
              position: absolute; top: 3px; bottom: 3px; left: 3px;
              width: calc(50% - 3px); border-radius: 9px;
              background: var(--surface);
              box-shadow: 0 1px 4px rgba(0,0,0,.12);
              transition: transform .3s cubic-bezier(.32,.72,0,1);
            }
            .seg.w i { transform: translateX(100%); }
            .seg button {
              position: relative; flex: 1; padding: 9px 0;
              font-size: 14px; font-weight: 500; color: var(--sub);
              transition: color .2s;
            }
            .seg button.on { color: var(--text); font-weight: 600; }

            .sbox {
              display: flex; align-items: center; gap: 10px;
              margin: 0 20px 8px; padding: 0 14px;
              height: 44px; border-radius: 12px;
              background: var(--surface2);
            }
            .sbox svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
            .sbox input {
              flex: 1; min-width: 0; background: none; border: 0; outline: 0;
              color: var(--text); font: inherit; font-size: 16px;
            }
            .sbox input::placeholder { color: var(--muted); }
            .sbox button { width: 28px; height: 28px; display: grid; place-items: center; color: var(--muted); }

            .hbody {
              flex: 1; min-height: 0; overflow-y: auto;
              padding: 4px 0 100px;
              -webkit-overflow-scrolling: touch;
            }
            .sh {
              padding: 18px 20px 8px;
              font-weight: 700; font-size: 18px;
              display: flex; align-items: baseline; gap: 8px;
            }
            .sh small { color: var(--sub); font-weight: 500; font-size: 13px; }

            .cards {
              display: flex; gap: 12px; overflow-x: auto;
              padding: 4px 20px 12px;
              scrollbar-width: none;
            }
            .cards::-webkit-scrollbar { display: none; }

            .pc {
              flex: none; width: 140px; height: 140px;
              border-radius: 14px; padding: 14px;
              text-align: left; display: flex; flex-direction: column;
              justify-content: flex-end; gap: 3px;
              position: relative; overflow: hidden;
              transition: transform .18s;
              box-shadow: 0 4px 16px rgba(0,0,0,.12);
            }
            .pc::after {
              content: ""; position: absolute; inset: 0;
              background: linear-gradient(to top, rgba(0,0,0,.45) 0%, transparent 55%);
              pointer-events: none;
            }
            .pc:active { transform: scale(.96); }
            .pc b, .pc small { position: relative; z-index: 1; }
            .pc b { font-size: 15px; font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .pc small { color: rgba(255,255,255,.8); font-size: 12px; }
            .pc.new {
              background: var(--surface2) !important;
              align-items: center; justify-content: center;
              box-shadow: none; border: 1.5px dashed var(--track);
            }
            .pc.new::after { display: none; }
            .pc.new b { font-size: 28px; font-weight: 300; color: var(--sub); }
            .pc.new small { color: var(--sub); }

            .row {
              display: flex; align-items: center; gap: 14px;
              padding: 10px 20px; cursor: pointer;
              transition: background .15s;
            }
            .row:active { background: var(--surface2); }
            .row.cur { background: var(--surface2); }
            .row-cover {
              width: 48px; height: 48px; border-radius: 8px; flex: none;
              box-shadow: 0 2px 8px rgba(0,0,0,.1);
              object-fit: cover; background: var(--surface2);
            }
            .row-info { flex: 1; min-width: 0; }
            .row-info b {
              display: block; font-size: 15px; font-weight: 500;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            }
            .row-info small { color: var(--sub); font-size: 13px; }
            .row-dur { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
            .empty { padding: 32px 24px; text-align: center; color: var(--sub); font-size: 14px; line-height: 1.5; }

            /* Mini player */
            .mini {
              position: absolute; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
              height: 64px; display: flex; align-items: center; gap: 12px;
              padding: 0 8px 0 8px; border-radius: 16px;
              background: var(--glass); backdrop-filter: blur(24px) saturate(180%);
              -webkit-backdrop-filter: blur(24px) saturate(180%);
              box-shadow: var(--shadow);
              cursor: pointer; z-index: 2; overflow: hidden;
              border: 1px solid rgba(0,0,0,.06);
            }
            .mc {
              width: 48px; height: 48px; border-radius: 10px; flex: none;
              box-shadow: 0 2px 8px rgba(0,0,0,.12);
              object-fit: cover; background: var(--surface2);
            }
            .mt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
            .mt b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            .mt small { color: var(--sub); font-size: 12px; }
            .mini-btns { display: flex; align-items: center; gap: 2px; }
            .mini button {
              width: 42px; height: 42px; display: grid; place-items: center;
            }
            .mini button svg { width: 22px; height: 22px; fill: currentColor; stroke: none; }
            .mp {
              position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px;
              background: var(--track);
            }
            .mp i {
              display: block; height: 100%; background: var(--text); width: 0;
              border-radius: 0 2px 2px 0;
              transition: none;
            }

            /* ========== NOW PLAYING – light ========== */
            .np {
              position: absolute; inset: 0; z-index: 3;
              display: flex; flex-direction: column; overflow: hidden;
              --tint-rgb: 232,228,239;
              background: rgb(var(--tint-rgb));
              transform: translateY(105%);
              visibility: hidden;
              transition: transform .5s cubic-bezier(.32,.72,0,1), visibility 0s .5s, --tint-rgb .9s ease;
              color: #2c2c2e;
            }
            .app.show .np {
              transform: none; visibility: visible;
              transition: transform .5s cubic-bezier(.32,.72,0,1), --tint-rgb .9s ease;
            }

            /* Nền: ảnh bìa làm mờ phủ toàn màn hình + lớp màu lấy từ ảnh (--tint-rgb) */
            .bg-blur {
              position: absolute; inset: -60px; z-index: 0;
              background-size: cover;
              background-position: center;
              filter: blur(48px) saturate(1.2);
              pointer-events: none;
            }
            .bg-wash {
              position: absolute; inset: 0; z-index: 0;
              background: linear-gradient(
                180deg,
                rgba(var(--tint-rgb), .25) 0%,
                rgba(var(--tint-rgb), .45) 50%,
                rgba(var(--tint-rgb), .85) 100%
              );
              pointer-events: none;
            }

            /* Ảnh bìa: rộng full màn hình, vuông, đặt phía trên.
               Mờ dần cả phía trên lẫn phía dưới hoà vào nền. ẢNH ĐỨNG YÊN (không zoom khi phát/dừng).
               Chỉnh --cover-top để đẩy ảnh lên/xuống. */
            .np {
              --cw: min(100vw, 430px);
              --cover-top: calc(env(safe-area-inset-top, 0px) + 32px);
            }
            .cover-bg {
              position: absolute; top: 0; left: 0; right: 0;
              aspect-ratio: 1 / 1.3;
              z-index: 0;
              overflow: hidden;
              -webkit-mask-image: linear-gradient(180deg,
                transparent 0, transparent var(--cover-top),
                rgba(0,0,0,.35) calc(var(--cover-top) + var(--cw) * .12),
                #000 calc(var(--cover-top) + var(--cw) * .34),
                #000 calc(var(--cover-top) + var(--cw) * .58),
                transparent calc(var(--cover-top) + var(--cw) * .99));
              mask-image: linear-gradient(180deg,
                transparent 0, transparent var(--cover-top),
                rgba(0,0,0,.35) calc(var(--cover-top) + var(--cw) * .12),
                #000 calc(var(--cover-top) + var(--cw) * .34),
                #000 calc(var(--cover-top) + var(--cw) * .58),
                transparent calc(var(--cover-top) + var(--cw) * .99));
            }
            .cover-inner {
              position: absolute; inset: 0;
              background-size: 100% auto;
              background-position: center var(--cover-top);
              background-repeat: no-repeat;
            }
            .cover-fallback {
              position: absolute; inset: 0;
              background:
                radial-gradient(ellipse 80% 60% at 50% 28%, var(--c1) 0%, transparent 55%),
                radial-gradient(circle at 22% 35%, var(--c2) 0 18%, transparent 45%),
                radial-gradient(circle at 78% 22%, var(--c3) 0 14%, transparent 40%),
                radial-gradient(circle at 65% 55%, var(--c4) 0 12%, transparent 38%),
                radial-gradient(ellipse at 50% 85%, var(--wash), transparent 55%),
                linear-gradient(180deg, #eae6f0 0%, #d9d2e4 40%, #cfc6db 100%);
            }

            .top {
              position: absolute; top: 0; left: 0; right: 0;
              display: flex; align-items: center; justify-content: space-between;
              padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 0;
              z-index: 2;
            }
            .top-left, .top-right {
              display: flex; align-items: center; gap: 4px;
            }
            .top button {
              width: 40px; height: 40px; display: grid; place-items: center;
              border-radius: 50%;
              color: rgba(40,40,50,.75);
            }
            .top button:active { background: rgba(0,0,0,.06); }
            .top svg { width: 22px; height: 22px; stroke-width: 1.6; }
            .top .status {
              display: flex; align-items: center; gap: 5px;
              font-size: 12px; font-weight: 500;
              padding: 5px 10px; border-radius: 16px;
              background: rgba(255,255,255,.55);
              color: rgba(40,40,50,.7);
              backdrop-filter: blur(8px);
              -webkit-backdrop-filter: blur(8px);
            }
            .status.fd { opacity: 0; transition: opacity .2s; }
            .status i {
              width: 6px; height: 6px; border-radius: 50%;
              background: #30d158;
              box-shadow: 0 0 0 2.5px rgba(48,209,88,.25);
            }
            .status.off i { background: rgba(0,0,0,.25); box-shadow: none; }

            .np-bottom {
              position: relative;
              z-index: 1;
              margin-top: auto;
              padding: 0 0 calc(12px + env(safe-area-inset-bottom, 0px));
              background: linear-gradient(
                to top,
                rgba(var(--tint-rgb), .92) 0%,
                rgba(var(--tint-rgb), .8) 50%,
                rgba(var(--tint-rgb), .35) 80%,
                transparent 100%
              );
              color: #2c2c2e;
            }

            .info {
              padding: 0 24px 4px;
              text-align: left;
            }
            .info h1 {
              margin: 0;
              font-size: 22px;
              font-weight: 700;
              letter-spacing: -.2px;
              color: #1c1c1e;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            }
            .artist-row {
              display: flex;
              align-items: center;
              flex-wrap: wrap;
              gap: 6px;
              margin-top: 6px;
            }
            .artist {
              font-size: 14px;
              font-weight: 500;
              color: #5c5c62;
            }

            /* Icon action row */
            .icon-row {
              display: flex;
              justify-content: space-around;
              align-items: center;
              padding: 10px 16px 2px;
            }
            .icon-row button {
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 4px;
              min-width: 56px;
              padding: 6px 4px;
              border-radius: 12px;
              color: #5c5c62;
              position: relative;
              transition: background .15s, color .15s;
            }
            .icon-row button:active { background: rgba(0,0,0,.06); }
            .icon-row svg {
              width: 22px;
              height: 22px;
              stroke-width: 1.7;
            }
            .icon-row .cnt {
              font-size: 11px;
              font-weight: 500;
              color: #8e8e93;
              line-height: 1;
            }
            .icon-row .liked svg {
              stroke: #ff2d55;
              fill: #ff2d55;
            }
            .icon-row .liked .cnt { color: #ff2d55; }

            /* Progress – smooth */
            .bar {
              padding: 10px 24px 0;
            }
            .seek {
              position: relative;
              height: 28px;
              display: flex;
              align-items: center;
              touch-action: none;
              cursor: pointer;
            }
            .seek::before {
              content: "";
              position: absolute;
              left: 0; right: 0;
              height: 4px;
              border-radius: 2px;
              background: rgba(0,0,0,.1);
            }
            .fill {
              position: absolute;
              left: 0;
              height: 4px;
              border-radius: 2px;
              background: #3a3a3c;
              width: 0;
              pointer-events: none;
              will-change: width;
            }
            .knob {
              position: absolute;
              width: 14px;
              height: 14px;
              margin-left: -7px;
              border-radius: 50%;
              background: #3a3a3c;
              box-shadow: 0 1px 4px rgba(0,0,0,.25);
              left: 0;
              pointer-events: none;
              will-change: left;
              transition: transform .15s;
            }
            .seek:active .knob { transform: scale(1.4); }
            .times {
              display: flex;
              justify-content: space-between;
              font-size: 11px;
              margin-top: 2px;
              font-variant-numeric: tabular-nums;
              font-weight: 500;
              color: #8e8e93;
            }

            /* Main controls */
            .ctrl {
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 6px 28px 8px;
            }
            .ctrl button {
              width: 48px;
              height: 48px;
              display: grid;
              place-items: center;
              border-radius: 50%;
              color: #2c2c2e;
              transition: background .15s, transform .15s;
            }
            .ctrl button:active { background: rgba(0,0,0,.06); }
            .ctrl svg { width: 26px; height: 26px; stroke-width: 1.7; }
            .ctrl .fl svg { fill: currentColor; stroke: none; }
            .ctrl .on { color: #ff2d55; }
            .ctrl .play {
              width: 56px;
              height: 56px;
              background: none;
              color: #1c1c1e;
            }
            .ctrl .play:active { transform: scale(.9); background: rgba(0,0,0,.06); }
            .ctrl .play svg { width: 32px; height: 32px; fill: currentColor; stroke: none; }

            .promo {
              margin: 4px 20px 0;
              padding: 8px 14px;
              border-radius: 10px;
              background: rgba(255,255,255,.55);
              display: flex;
              align-items: center;
              gap: 8px;
              font-size: 12px;
              color: #6e6e73;
              border: 1px solid rgba(0,0,0,.04);
            }
            .promo span { flex: 1; }
            .promo b { color: #b07a00; font-weight: 600; }

            /* Animations */
            .nx { animation: inR .4s cubic-bezier(.32,.72,0,1); }
            .pv { animation: inL .4s cubic-bezier(.32,.72,0,1); }
            .cv { animation: cv .55s cubic-bezier(.32,.72,0,1); }
            .icn { animation: icn .22s ease; }
            @keyframes inR { from { opacity: 0; transform: translateX(24px); } }
            @keyframes inL { from { opacity: 0; transform: translateX(-24px); } }
            @keyframes cv { from { opacity: 0; transform: scale(1.06); } }
            @keyframes icn { from { opacity: 0; transform: scale(.55); } }

            /* ========== SHEET ========== */
            .sheet {
              position: absolute; inset: 0;
              display: flex; align-items: flex-end;
              background: rgba(0,0,0,0); z-index: 5;
              visibility: hidden;
              transition: background .3s, visibility 0s .35s;
            }
            .sheet.open {
              background: rgba(0,0,0,.4); visibility: visible;
              transition: background .3s;
            }
            .pane {
              width: 100%; max-height: 78%;
              display: flex; flex-direction: column;
              background: var(--surface);
              border-radius: 20px 20px 0 0;
              transform: translateY(100%);
              transition: transform .4s cubic-bezier(.32,.72,0,1);
              padding-bottom: env(safe-area-inset-bottom, 0px);
              box-shadow: 0 -8px 40px rgba(0,0,0,.15);
            }
            .pane.tall { height: 78%; }
            .sheet.open .pane { transform: none; }
            .grab {
              width: 36px; height: 4px; border-radius: 2px;
              background: var(--track); margin: 10px auto 4px; flex: none;
            }
            .hd {
              display: flex; justify-content: space-between; align-items: baseline;
              gap: 10px; padding: 8px 20px 6px;
              font-weight: 700; font-size: 17px; flex: none;
            }
            .hd small { font-weight: 500; color: var(--sub); font-size: 13px; }
            .chips {
              display: flex; gap: 8px; overflow-x: auto;
              padding: 4px 20px 10px; flex: none; scrollbar-width: none;
            }
            .chips::-webkit-scrollbar { display: none; }
            .chip {
              flex: none; padding: 7px 14px; border-radius: 20px;
              background: var(--surface2); font-size: 13px; font-weight: 500;
              transition: background .25s cubic-bezier(.32,.72,0,1), color .25s, transform .2s;
            }
            .chip:active { transform: scale(.94); }
            .chip.on { background: var(--text); color: var(--bg); }
            .body {
              flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 16px;
              -webkit-overflow-scrolling: touch;
              transition: opacity .2s ease, transform .25s cubic-bezier(.32,.72,0,1);
            }
            .body.sw { opacity: 0; transform: translateY(8px); }
            .sheet .row {
              opacity: 0; transform: translateY(10px);
              animation: rise .35s forwards;
              animation-delay: calc(var(--k, 0) * 35ms + 80ms);
            }
            .na .row { animation: none; opacity: 1; transform: none; }
            @keyframes rise { to { opacity: 1; transform: none; } }

            .tm { display: flex; align-items: center; gap: 8px; flex: none; }
            .tm button { width: 28px; height: 28px; color: var(--muted); display: grid; place-items: center; }
            .ck {
              width: 22px; height: 22px; border-radius: 50%;
              border: 1.5px solid var(--muted); display: grid; place-items: center;
              font-size: 12px; color: #fff; flex: none;
              transition: background .2s, border-color .2s;
            }
            .ck.on { background: var(--accent); border-color: var(--accent); }
            .add {
              display: flex; gap: 8px; padding: 8px 20px;
            }
            .add input {
              flex: 1; min-width: 0; background: var(--surface2); border: 0;
              border-radius: 12px; padding: 12px 14px; color: var(--text);
              font: inherit; font-size: 15px; outline: 0;
            }
            .add button {
              padding: 0 16px; border-radius: 12px;
              background: var(--text); color: var(--bg); font-weight: 600; font-size: 14px;
            }

            /* Vocab list in sheet – Trung / Pinyin / Việt */
            .vlist { padding: 4px 20px 24px; }
            .vhead {
              display: grid;
              grid-template-columns: 1fr 1.15fr 1fr;
              gap: 8px;
              padding: 6px 4px 10px;
              font-size: 11px;
              font-weight: 600;
              color: var(--muted);
              text-transform: uppercase;
              letter-spacing: .4px;
              border-bottom: 1px solid var(--track);
              position: sticky;
              top: 0;
              background: var(--surface);
              z-index: 1;
            }
            .vitem {
              display: grid;
              grid-template-columns: 1fr 1.15fr 1fr;
              gap: 8px;
              padding: 12px 4px;
              border-bottom: 1px solid rgba(0,0,0,.05);
              font-size: 14px;
              line-height: 1.4;
              opacity: 0;
              transform: translateY(8px);
              animation: rise .35s forwards;
              animation-delay: calc(var(--k, 0) * 28ms + 60ms);
            }
            .vitem:last-child { border-bottom: 0; }
            .na .vitem { animation: none; opacity: 1; transform: none; }
            .vitem .zh { font-weight: 600; color: var(--text); font-size: 15px; }
            .vitem .py { color: var(--sub); font-style: italic; font-size: 13px; }
            .vitem .vi { color: var(--sub); font-size: 13px; }
            .lytxt {
              padding: 8px 24px 32px; font-size: 17px; line-height: 1.85;

            function rgbToHsl(r, g, b) {
              r /= 255; g /= 255; b /= 255;
              var mx = Math.max(r, g, b), mn = Math.min(r, g, b);
              var l = (mx + mn) / 2, d = mx - mn, h = 0, s = 0;
              if (d > 0) {
                s = d / (1 - Math.abs(2 * l - 1));
                if (mx === r) h = ((g - b) / d) % 6;
                else if (mx === g) h = (b - r) / d + 2;
                else h = (r - g) / d + 4;
                h *= 60;
                if (h < 0) h += 360;
              }
              return [h, s, l];
            }
            function hslToRgb(h, s, l) {
              var C = (1 - Math.abs(2 * l - 1)) * s;
              var X = C * (1 - Math.abs((h / 60) % 2 - 1));
              var m = l - C / 2, r, g, b;
              if (h < 60) { r = C; g = X; b = 0; }
              else if (h < 120) { r = X; g = C; b = 0; }
              else if (h < 180) { r = 0; g = C; b = X; }
              else if (h < 240) { r = 0; g = X; b = C; }
              else if (h < 300) { r = X; g = 0; b = C; }
              else { r = C; g = 0; b = X; }
              return [Math.round((r + m) * 255), Math.round((g + m) * 255), Math.round((b + m) * 255)];

              // gộp 3 nhóm hue liền kề, chọn cụm có trọng số lớn nhất
              var best = -1, bw = 0, W, R, G, B;
              for (k = 0; k < BINS; k++) {
                W = 0;
                for (j = -1; j <= 1; j++) W += bins[(k + j + BINS) % BINS].w;
                if (W > bw) { bw = W; best = k; }
              }
              if (best < 0 || bw < cnt * .004) {
                // ảnh gần như đen-trắng/xám: dùng màu trung bình, giữ nền trung tính
                var a = rgbToHsl(aR / cnt, aG / cnt, aB / cnt);
                return tintFrom(a[0], Math.min(a[1], .08), avgL);
              }
              R = G = B = W = 0;
              for (j = -1; j <= 1; j++) {
                var q = bins[(best + j + BINS) % BINS];
                R += q.r; G += q.g; B += q.b; W += q.w;
              }
              var dom = rgbToHsl(R / W, G / W, B / W);
              return tintFrom(dom[0], dom[1], avgL);
            }

            function tintFromImage(url, fallback) {
              if (tintCache[url]) { setTint(tintCache[url]); return; }
              setTint(fallback);
              function apply(rgb) {
                tintCache[url] = rgb;
                if (tracks[i] && tracks[i].img === url) setTint(rgb);
              }
              function sample(src, retry) {
                var im = new Image();
                im.crossOrigin = "anonymous";
                im.onload = function () {
                  try { apply(dominantTint(im)); }
                  catch (e) { if (retry) retry(); }
                };
                im.onerror = function () { if (retry) retry(); };
                im.src = src;
              }
              var viaProxy = null;
              if (USE_CORS_PROXY && /^https?:/i.test(url)) {
                viaProxy = function () {
                  sample("https://wsrv.nl/?url=" + encodeURIComponent(url) + "&w=64&h=64&fit=cover&output=jpg");
                };
              }
              sample(url, viaProxy);
            }

            function setCover(tr) {
              var inner = $("coverInner");
              var fallback = $("coverFallback");
              var blur = $("bgBlur");
              var fb = tintFromColor(tr.w);
              if (tr.img) {
                inner.style.backgroundImage = 'url("' + tr.img + '")';
                blur.style.backgroundImage = 'url("' + tr.img + '")';
                inner.style.opacity = "1";
                blur.style.opacity = "1";
                tintFromImage(tr.img, fb);
              } else {
                inner.style.backgroundImage = "none";
                blur.style.backgroundImage = "none";
                inner.style.opacity = "0";
                blur.style.opacity = "0";
                setTint(fb);
              }
              var cv = fallback.style;
              cv.setProperty("--c1", tr.c[0]);
              cv.setProperty("--c2", tr.c[1]);
              cv.setProperty("--c3", tr.c[2]);
              cv.setProperty("--c4", tr.c[3]);
              cv.setProperty("--wash", tr.w);
            }

            function updMini() {
              var tr = tracks[i];
              $("mT").textContent = tr.t;
              $("mA").textContent = tr.a;
              var mc = $("mc");
              if (tr.img) {
                mc.src = tr.img;
                mc.style.background = "";
              } else {
                mc.removeAttribute("src");
                mc.style.background = "linear-gradient(135deg," + tr.c[0] + "," + tr.w + "), var(--surface2)";
              }
              $("mPlay").innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
            }

            function stopRaf() {
              if (raf) {
                cancelAnimationFrame(raf);
                raf = null;
              }
            }

            function startSmoothPaint() {
              stopRaf();
              function tick() {
                if (!playing) return;
                if (useAudio) {
                  pos = audio.currentTime || 0;
                }
                paint();
                raf = requestAnimationFrame(tick);
              }
              raf = requestAnimationFrame(tick);
            }

            function load(n, dir) {
              i = (n + tracks.length) % tracks.length;
              pos = 0;
              var tr = tracks[i];
              useAudio = !!(tr.src && tr.src.trim());

              setCover(tr);
              $("title").textContent = tr.t;
              $("artist").textContent = tr.a;
              $("dur").textContent = fmt(tr.d);
              document.title = tr.t + " – " + tr.a;

              if (useAudio) {
                audio.src = tr.src;
                audio.load();
                audio.onloadedmetadata = function () {
                  if (isFinite(audio.duration)) {
                    $("dur").textContent = fmt(audio.duration);
                    tracks[i].d = Math.round(audio.duration);
                  }
                };
              } else {
                audio.removeAttribute("src");
                audio.load();
              }

              if (dir) {
                var c = dir > 0 ? "nx" : "pv";
                pop($("title"), c);
                pop($("artist"), c);
                pop($("cover"), "cv");
              }
              syncLike();
              syncBadge();
              updMini();
              renderHome(1);
              if (mode === "q") render(1);
              if (mode === "v") render(1);
              paint();
            }

            function setPlaying(v, first) {
              playing = v;
              $("play").innerHTML = v ? ICON_PAUSE : ICON_PLAY;
              if ($("play").firstElementChild) pop($("play").firstElementChild, "icn");
              updMini();
              var st = $("status");
              function apply() {
                $("stxt").textContent = v ? "Đang phát" : "Tạm dừng";
                st.classList.toggle("off", !v);
                st.classList.remove("fd");
              }
              if (first) apply();
              else {
                st.classList.add("fd");
                setTimeout(apply, 180);
              }

              clearInterval(timer);
              stopRaf();

              if (v) {
                if (useAudio) {
                  audio.currentTime = pos;
                  var p = audio.play();
                  if (p && p.catch) p.catch(function () {
                    toast("Không phát được audio (cần URL hợp lệ)");
                    setPlaying(false, true);
                  });
                  startSmoothPaint();
                } else {
                  // Demo timer – update every frame for smooth bar
                  var last = performance.now();
                  function tick(now) {
                    if (!playing) return;
                    var dt = (now - last) / 1000;
                    last = now;
                    pos += dt;
                    if (pos >= tracks[i].d) {
                      step(1);
                      return;
                    }
                    paint();
                    raf = requestAnimationFrame(tick);
                  }
                  raf = requestAnimationFrame(tick);
                }
              } else {
                if (useAudio) audio.pause();
              }
            }

            function step(dir) {
              var n = i + dir;
              if (shuffle && dir > 0 && tracks.length > 1) {
                do { n = Math.floor(Math.random() * tracks.length); } while (n === i);
              }
              var wasPlaying = playing;
              setPlaying(false);
              load(n, dir);
              if (wasPlaying) setPlaying(true);
            }

            function playTrack(k) {
              if (k !== i) {
                setPlaying(false);
                load(k, k > i ? 1 : -1);
              }
              setPlaying(true);
              openPlayer();
            }

            function jumpV(k) {
              var v = S.v[k];
              if (!v) return;
              if (v.t !== i) {
                setPlaying(false);
                load(v.t, 1);
              }
              pos = v.p;
              if (useAudio) audio.currentTime = pos;
              paint();
              setPlaying(true);
              openPlayer();
              close();
            }

            // Audio events
            audio.addEventListener("ended", function () { step(1); });
            audio.addEventListener("timeupdate", function () {
              if (useAudio && playing) pos = audio.currentTime;
            });
            audio.addEventListener("error", function () {
              if (useAudio && tracks[i].src) {
                toast("Lỗi tải audio – dùng chế độ demo");
                useAudio = false;
              }
            });

            // ========== HOME ==========
            function rowT(k, n) {
              var tr = tracks[k];
              var coverHtml = tr.img
                ? '<img class="row-cover" src="' + esc(tr.img) + '" alt="" />'
                : '<div class="row-cover" style="background:linear-gradient(135deg,' + tr.c[0] + ',' + tr.w + ')"></div>';
              return (
                '<div class="row' + (k === i ? " cur" : "") + '" data-a="hplay" data-k="' + k + '" style="--k:' + n + '">' +
                coverHtml +
                '<div class="row-info"><b>' + esc(tr.t) + '</b><small>' + esc(tr.a) + '</small></div>' +
                '<span class="row-dur">' + fmt(tr.d) + '</span></div>'
              );
            }

            function rowV(x, n) {
              var v = x[0];
              return (
                '<div class="row" data-a="hjump" data-k="' + x[1] + '" style="--k:' + n + '">' +
                '<div class="row-info"><b>' + esc(v.w) + '</b><small>' + esc(v.m || "—") + '</small></div>' +
                '<span class="row-dur">' + esc(tracks[v.t].t) + ' · ' + fmt(v.p) + '</span></div>'
              );
            }

            function sec(t, c) {
              return '<div class="sh">' + t + ' <small>' + c + '</small></div>';
            }

            function renderHome(na) {
              var B = $("hbody"), h = "", q = hq.trim().toLowerCase();
              var all = tracks.map(function (_, k) { return k; });
              B.classList.toggle("na", !!na);

              if (hm === "m" && q) {
                var qn = stripTones(q);
                var r = all.filter(function (k) {
                  var tr = tracks[k];
                  var hay = stripTones(tr.t + " " + tr.a + " " + (tr.py || ""));
                  return hay.indexOf(qn) >= 0;
                });
                h = r.length
                  ? sec("Kết quả", r.length) + r.map(rowT).join("")
                  : '<div class="empty">Không tìm thấy bài nào</div>';
              } else if (hm === "w") {
                var vs = S.v
                  .map(function (v, k) { return [v, k]; })
                  .filter(function (x) {
                    return !q || (x[0].w + " " + (x[0].m || "")).toLowerCase().indexOf(q) >= 0;
                  });
                h =
                  sec(q ? "Kết quả" : "Sổ từ vựng", vs.length) +
                  (vs.length
                    ? vs.slice(0, 60).map(rowV).join("")
                    : '<div class="empty">' +
                      (q
                        ? "Chưa có từ này trong sổ"
                        : "Chưa có từ vựng nào.<br>Mở bài hát → bấm biểu tượng tìm để ghi từ.") +
                      "</div>");
                if (q && !S.v.some(function (v) { return v.w.toLowerCase() === q; })) {
                  h +=
                    '<div class="add"><input id="hmean" placeholder="Nghĩa của “' +
                    esc(hq.trim()) +
                    '”"><button data-a="hsave">Lưu</button></div>';
                }
              } else {
                h =
                  sec("Playlist của tôi", S.p.length) +
                  '<div class="cards">' +
                  S.p
                    .map(function (p, k) {
                      var t = tracks[k % tracks.length];
                      return (
                        '<button class="pc" data-a="hpl" data-k="p' +
                        k +
                        '" style="background:linear-gradient(150deg,' +
                        t.c[0] +
                        "," +
                        t.w +
                        ')"><b>' +
                        esc(p.n) +
                        "</b><small>" +
                        p.s.length +
                        " bài</small></button>"
                      );
                    })
                    .join("") +
                  '<button class="pc new" data-a="hnew"><b>＋</b><small>Playlist mới</small></button></div>';

                if (creating) {
                  h +=
                    '<div class="add"><input id="hpn" maxlength="30" placeholder="Tên playlist mới"><button data-a="hcreate">Tạo</button></div>';
                }

                h +=
                  sec("Yêu thích", S.f.length) +
                  (S.f.length
                    ? S.f.map(rowT).join("")
                    : '<div class="empty">Bấm ♥ ở trình phát để lưu bài yêu thích</div>');

                h += sec("Tất cả bài hát", tracks.length) + all.map(rowT).join("");
              }
              B.innerHTML = h;
            }

            $("hbody").onclick = function (e) {
              var b = e.target.closest("[data-a]");
              if (!b) return;
              var a = b.dataset.a, k = b.dataset.k;
              if (a === "hplay") playTrack(+k);
              else if (a === "hpl") open("q", k);
              else if (a === "hnew") {
                creating = !creating;
                renderHome(1);
                if (creating) $("hpn") && $("hpn").focus();
              } else if (a === "hcreate") homeCreate();
              else if (a === "hjump") jumpV(+k);
              else if (a === "hsave") homeSaveWord();
            };

            $("hbody").addEventListener("keydown", function (e) {
              if (e.key !== "Enter") return;
              if (e.target.id === "hpn") homeCreate();
              else if (e.target.id === "hmean") homeSaveWord();
            });

            function homeCreate() {
              var v = $("hpn").value.trim();
              if (!v) return;
              S.p.push({ n: v, s: [] });
              creating = false;
              save();
              toast("Đã tạo playlist “" + v + "”");
            }

            function homeSaveWord() {
              var w = hq.trim();
              if (!w) return;
              S.v.unshift({ w: w, m: $("hmean").value.trim(), t: i, p: pos });
              save();
              syncBadge();
              toast("Đã lưu từ vựng");
            }

            $("q").oninput = function () {
              hq = this.value;
              $("qc").hidden = !hq;
              renderHome(1);
            };
            $("qc").onclick = function () {
              hq = "";
              $("q").value = "";
              this.hidden = true;
              renderHome();
              $("q").focus();
            };

            document.querySelectorAll(".seg button").forEach(function (b) {
              b.onclick = function () {
                hm = b.dataset.m;
                hq = "";
                $("q").value = "";
                $("qc").hidden = true;
                $("seg").classList.toggle("w", hm === "w");
                document.querySelectorAll(".seg button").forEach(function (x) {
                  x.classList.toggle("on", x === b);
                });
                $("q").placeholder =
                  hm === "m" ? "Tìm bài hát, nghệ sĩ, pinyin..." : "Tra từ trong sổ từ vựng...";
                renderHome();
              };
            });

            $("mini").onclick = openPlayer;
            $("mPlay").onclick = function (e) {
              e.stopPropagation();
              setPlaying(!playing);
            };
            $("min").onclick = closePlayer;

            // ========== SHEET ==========
            function open(m, arg) {
              mode = m;
              if (m === "q") tab = arg || "all";
              if (m === "v") {
                vp = pos;
                vi = i;
                vt = "cur";
              }
              render();
              $("sheet").classList.add("open");
            }
            function close() {
              $("sheet").classList.remove("open");
              mode = "";
            }

            function render(na) {
              var P = $("pane"),
                h = '<div class="grab"></div>',
                tr = tracks[i];
              P.classList.toggle("na", !!na);
              P.classList.toggle("tall", mode === "ly" || mode === "v");

              if (mode === "q") {
                var ch = [
                  ["all", "Tất cả"],
                  ["fav", "Yêu thích"]
                ].concat(
                  S.p.map(function (p, k) {
                    return ["p" + k, p.n];
                  })
                );
                var ids =
                  tab === "all"
                    ? tracks.map(function (_, k) { return k; })
                    : tab === "fav"
                    ? S.f
                    : (S.p[+tab.slice(1)] || { s: [] }).s;
                h +=
                  '<div class="hd">Danh sách phát</div><div class="chips">' +
                  ch
                    .map(function (c) {
                      return (
                        '<button class="chip' +
                        (c[0] === tab ? " on" : "") +
                        '" data-a="tab" data-k="' +
                        c[0] +
                        '">' +
                        esc(c[1]) +
                        "</button>"
                      );
                    })
                    .join("") +
                  '</div><div class="body">' +
                  (ids.length
                    ? ids
                        .map(function (k, n) {
                          var coverHtml = tracks[k].img
                            ? '<img class="row-cover" src="' + esc(tracks[k].img) + '" alt="" />'
                            : '<div class="row-cover" style="background:linear-gradient(135deg,' +
                              tracks[k].c[0] +
                              "," +
                              tracks[k].w +
                              ')"></div>';
                          return (
                            '<div class="row' +
                            (k === i ? " cur" : "") +
                            '" data-a="play" data-k="' +
                            k +
                            '" style="--k:' +
                            n +
                            '">' +
                            coverHtml +
                            '<div class="row-info"><b>' +
                            esc(tracks[k].t) +
                            "</b><small>" +
                            esc(tracks[k].a) +
                            "</small></div>" +
                            '<span class="row-dur">' +
                            fmt(tracks[k].d) +
                            "</span></div>"
                          );
                        })
                        .join("")
                    : '<div class="empty">Chưa có bài nào</div>') +
                  "</div>";
              } else if (mode === "a") {
                var rows = [
                  ["f", "Yêu thích", S.f.length, S.f.indexOf(i) >= 0]
                ].concat(
                  S.p.map(function (p, k) {
                    return [k, p.n, p.s.length, p.s.indexOf(i) >= 0];
                  })
                );
                h +=
                  '<div class="hd">Thêm vào playlist <small>' +
                  esc(tr.t) +
                  '</small></div><div class="body">' +
                  rows
                    .map(function (x, n) {
                      return (
                        '<div class="row" data-a="tog" data-k="' +
                        x[0] +
                        '" style="--k:' +
                        n +
                        '"><div class="row-info"><b>' +
                        esc(x[1]) +
                        "</b><small>" +
                        x[2] +
                        ' bài</small></div><span class="ck' +
                        (x[3] ? " on" : "") +
                        '">' +
                        (x[3] ? "✓" : "") +
                        "</span></div>"
                      );
                    })
                    .join("") +
                  '<div class="add"><input id="npl" maxlength="30" placeholder="Tên playlist mới"><button data-a="newpl">Tạo</button></div></div>';
              } else if (mode === "v") {
                var list = tr.vocab || [];
                h +=
                  '<div class="hd">Từ vựng bài này <small>' +
                  esc(tr.t) +
                  " · " +
                  list.length +
                  " từ</small></div>" +
                  '<div class="body">' +
                  (list.length
                    ? '<div class="vlist"><div class="vhead"><span>Trung</span><span>Pinyin</span><span>Việt</span></div>' +
                      list
                        .map(function (v, n) {
                          return (
                            '<div class="vitem" style="--k:' +
                            n +
                            '"><span class="zh">' +
                            esc(v.zh) +
                            '</span><span class="py">' +
                            esc(v.py) +
                            '</span><span class="vi">' +
                            esc(v.vi) +
                            "</span></div>"
                          );
                        })
                        .join("") +
                      "</div>"
                    : '<div class="empty">Bài này chưa có từ vựng</div>') +
                  "</div>";
              } else if (mode === "ly") {
                var lyHtml = tr.l
                  .map(function (sec) {
                    var singer = sec.s
                      ? '<span class="singer">' + esc(sec.s) + "</span>\n"
                      : "";
                    return singer + sec.lines.map(esc).join("\n");
                  })
                  .join("\n\n");
                h +=
                  '<div class="hd"><span>Lời bài hát <small>' +
                  esc(tr.t) +
                  '</small></span><button class="chip" data-a="copy">Sao chép</button></div>' +
                  '<div class="body"><div class="lytxt" id="lyt">' +
                  lyHtml +
                  "</div></div>";

            }

            function copyLy() {
              var tr = tracks[i];
              var txt = tr.l
                .map(function (sec) {
                  return (sec.s ? sec.s + "\n" : "") + sec.lines.join("\n");
                })
                .join("\n\n");
              function fb() {
                var r = document.createRange();
                r.selectNodeContents($("lyt"));
                var s = getSelection();
                s.removeAllRanges();
                s.addRange(r);
                try { document.execCommand("copy"); } catch (e) {}
                toast("Đã sao chép lời");
              }
              if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(txt).then(function () {
                  toast("Đã sao chép lời");
                }, fb);
              } else fb();
            }

            function togList(k) {
              if (k === "f") {
                togFav();
                render(1);
                return;
              }
              var a = S.p[+k].s,
                j = a.indexOf(i);
              if (j < 0) {
                a.push(i);
                toast("Đã thêm vào “" + S.p[+k].n + "”");
              } else {
                a.splice(j, 1);
                toast("Đã bỏ khỏi “" + S.p[+k].n + "”");
              }
              save();
              render(1);
            }

            function togFav() {
              var j = S.f.indexOf(i);
              if (j < 0) {
                S.f.push(i);
                toast("Đã thêm vào Yêu thích");
              } else {
                S.f.splice(j, 1);
                toast("Đã bỏ khỏi Yêu thích");
              }
              save();
              syncLike();

                $("vw").focus();
                return;

              S.v.unshift({ w: w, m: m, t: vi, p: vp });

              toast("Đã lưu từ vựng");

              render(1);

              var v = $("npl").value.trim();

              save();

              if (!b) return;

                if (tab === k) return;

                if (body2) {

                  setTimeout(function () { render(); }, 160);
                } else render();
              } else if (a === "addv") addVocab();
              else if (a === "delv") {
                S.v.splice(+k, 1);
                save();
                syncBadge();
                render(1);
              } else if (a === "jump") jumpV(+k);

            $("pane").addEventListener("input", function (e) {

            $("pane").addEventListener("keydown", function (e) {
              if (e.key !== "Enter") return;
              if (e.target.id === "vw") $("vm").focus();
              else if (e.target.id === "vm") addVocab();
              else if (e.target.id === "npl") newPl();
            });
            $("sheet").onclick = function (e) {
              if (e.target === this) close();
            };

            // ========== CONTROLS ==========
            function seekTo(e) {
              var r = $("seek").getBoundingClientRect();
              var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
              var tr = tracks[i];
              var dur = useAudio && audio.duration && isFinite(audio.duration) ? audio.duration : tr.d;
              pos = f * dur;
              if (useAudio) audio.currentTime = pos;
              paint();
            }
            var drag = false;
            $("seek").addEventListener("pointerdown", function (e) {
              drag = true;
              this.setPointerCapture(e.pointerId);
              seekTo(e);
            });
            $("seek").addEventListener("pointermove", function (e) {
              if (drag) seekTo(e);
            });
            $("seek").addEventListener("pointerup", function () {
              drag = false;
            });

            $("play").onclick = function () { setPlaying(!playing); };
            $("prev").onclick = function () {
              if (pos > 3) {
                pos = 0;
                if (useAudio) audio.currentTime = 0;
                paint();
              } else step(-1);
            };
            $("next").onclick = function () { step(1); };
            $("shuffle").onclick = function () {
              shuffle = !shuffle;
              this.classList.toggle("on", shuffle);
              toast(shuffle ? "Phát ngẫu nhiên: Bật" : "Phát ngẫu nhiên: Tắt");
            };
            $("like").onclick = togFav;
            $("queue").onclick = function () { open("q"); };
            $("bV").onclick = function () { open("v"); };
            $("bA").onclick = function () { open("a"); };
            $("bL").onclick = function () { open("ly"); };

            $("share").onclick = function () {
              var tr = tracks[i];
              var text = tr.t + " – " + tr.a;
              if (navigator.share) {
                navigator.share({ title: text, text: text }).catch(function () {});
              } else {
                toast("Đã sao chép: " + text);
                if (navigator.clipboard) navigator.clipboard.writeText(text).catch(function () {});
              }
            };

            // Init
            load(0);
            pos = 0;
            syncBadge();
            paint();
            setPlaying(false, true);
            renderHome();
        </script>
    </body>
</html>
